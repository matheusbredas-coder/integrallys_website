# O nginx padrão não conhece .vcf e o entrega como application/octet-stream: o iPhone baixa
# um arquivo sem nome em vez de abrir "Adicionar contato". Este bloco entra no contexto http
# (o default.conf da imagem inclui conf.d/*.conf) e soma ao mime.types, não o substitui.
# Usado pelo botão "Salvar contato" da tela final do quiz (/integrallys.vcf).
types {
    text/vcard vcf;
}
