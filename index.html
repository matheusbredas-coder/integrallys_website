<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when polyfills (like formdata-polyfill) try to monkey-patch fetch 
      // in environments where window.fetch is a non-writable accessor (getter-only).
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Try to ensure FormData appears modern to avoid triggering polyfills in the first place
          if (typeof FormData !== 'undefined' && !FormData.prototype.keys) {
            FormData.prototype.keys = function() { return [].keys(); };
          }
          
          // 2. Try to make fetch writable if it currently only has a getter
          try {
            const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (desc && desc.get && !desc.set && desc.configurable) {
              const originalFetch = window.fetch;
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } else if (!desc || desc.configurable) {
              // If it doesn't exist or is configurable, we can ensure it's writable
              const currentFetch = window.fetch;
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { console.warn('Fetch was attempted to be overridden'); },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {
            // If redefinition fails, we attempt to at least shim globalThis if it's different
            try {
              if (typeof globalThis !== 'undefined' && globalThis !== window) {
                globalThis.fetch = window.fetch;
              }
            } catch (e2) {}
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
