<!doctype html>
<!--
  Só para desenvolvimento: troca a visão do quiz entre celular e computador.
  Não entra no build (não está no `input` do vite.config.ts), então nunca vai para o ar.
  Abra em http://localhost:<porta>/preview.html
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prévia do quiz</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #e9e6df;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #072737;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        width: 100%;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        padding: 14px 16px;
        background: #072737;
      }
      .toggle { display: flex; background: rgb(255 255 255 / 0.1); border-radius: 999px; padding: 4px; }
      .toggle button {
        border: 0;
        background: transparent;
        color: #fff;
        font: 600 14px/1 inherit;
        padding: 10px 20px;
        border-radius: 999px;
        cursor: pointer;
      }
      .toggle button[aria-pressed="true"] { background: #e3bc3c; color: #072737; }
      header a, header .size { color: rgb(255 255 255 / 0.7); font-size: 13px; }
      main { flex: 1; width: 100%; display: flex; justify-content: center; padding: 24px 16px; }
      .frame {
        background: #fff;
        overflow: hidden;
        transition: width 0.3s, height 0.3s, border-radius 0.3s;
      }
      .frame.mobile {
        width: 390px;
        height: 844px;
        border-radius: 44px;
        border: 12px solid #111;
        box-shadow: 0 30px 60px rgb(0 0 0 / 0.25);
      }
      .frame.desktop {
        width: min(1280px, 100%);
        height: calc(100vh - 120px);
        border-radius: 12px;
        border: 1px solid #cfcac0;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.15);
      }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <header>
      <div class="toggle" role="group" aria-label="Tamanho da tela">
        <button type="button" data-mode="mobile">Celular</button>
        <button type="button" data-mode="desktop">Computador</button>
      </div>
      <span class="size" id="size"></span>
      <a href="#" id="reload">Recomeçar o quiz</a>
      <span class="size">Telas finais:</span>
      <a href="#" data-tela="fimQuente">Obrigado (lead boa)</a>
      <a href="#" data-tela="fimQuente&fora">Obrigado (lead boa, à noite)</a>
      <a href="#" data-tela="fimFria">Obrigado (fria)</a>
      <a href="#" data-tela="fimFora">Fora da área</a>
    </header>
    <main>
      <div class="frame" id="frame">
        <iframe id="quiz" src="/avaliacao/" title="Quiz"></iframe>
      </div>
    </main>
    <script>
      const frame = document.getElementById('frame');
      const size = document.getElementById('size');
      const buttons = document.querySelectorAll('[data-mode]');

      function setMode(mode) {
        frame.className = 'frame ' + mode;
        buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
        size.textContent = mode === 'mobile' ? '390 × 844 (iPhone)' : 'até 1280 px';
        try { localStorage.setItem('quiz-preview-mode', mode); } catch {}
      }

      buttons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      // Abre direto numa tela final (só funciona no npm run dev; ver devStart em Quiz.tsx).
      document.querySelectorAll('[data-tela]').forEach((a) =>
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById('quiz').src = '/avaliacao/?tela=' + a.dataset.tela + '&nome=Maria';
        }),
      );
      document.getElementById('reload').addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('quiz').src = '/avaliacao/';
      });

      let saved = 'mobile';
      try { saved = localStorage.getItem('quiz-preview-mode') || 'mobile'; } catch {}
      setMode(saved);
    </script>
  </body>
</html>
